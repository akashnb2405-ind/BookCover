
<!DOCTYPE html>
<html>
<head>
    <title>Book Back Cover</title>

    <style>
        body {
            background-color: #e8dfd0;
            font-family: Arial;
        }

        .cover {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background-color: #243447;
            color: white;
            text-align: center;
            border-radius: 10px;
        }

        h1 {
            color: #f4c542;
        }

        img {
            width: 150px;
            height: 180px;
            border-radius: 8px;
        }

        p {
            line-height: 1.6;
            text-align: justify;
        }

        .author {
            color: #f4c542;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="cover">

        <h1>THE POWER OF DREAMS</h1>

        <img src="https://placehold.co/150x180/40566b/ffffff?text=BOOK"
             alt="Book Image">

        <h2>About This Book</h2>

        <p>
            This book inspires readers to follow their dreams,
            overcome challenges and achieve success.
            
            It teaches the importance of confidence,
            hard work and determination.
        </p>

        <p class="author">
            Written by: AKASH
        </p>

        <p>
            Price: Rs. 1299 $
        </p>

    </div>

</body>
</html>
